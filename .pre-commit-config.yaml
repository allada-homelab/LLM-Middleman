repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        # hass = Home Assistant object/domain term (not "hash");
        # hel = truncated streaming-delta token ("Hel"+"lo") in SSE test fixtures.
        args: ["-L", "hass,hel"]
        additional_dependencies: ["tomli"]

  # Secret scanning: a leaked token is caught before it reaches a commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
      # The stock hook above is `--staged`, so on a clean CI checkout it scans
      # nothing (a committed fake token reports "0 commits scanned"). This
      # manual-stage copy scans every commit; CI runs it with full history via
      # `pre-commit run gitleaks-history --hook-stage manual --all-files`.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (git history)
        entry: gitleaks git --redact --verbose
        stages: [manual]

  # Audits .github/workflows and dependabot.yml. Gated at medium, the same bar the
  # template's own CI holds rendered workflows to, so known low findings don't block.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --min-severity=medium]

  # Local hooks invoke the project's pinned ruff via uv, so the hook, CI, and
  # editor all run the exact same ruff version.
  #
  # `--frozen` is load-bearing: a bare `uv run` re-resolves and may rewrite
  # uv.lock. On a runner pointed at a different index than the lock was built
  # against — ours resolve via an internal PyPI mirror while the lock holds
  # files.pythonhosted.org URLs — that rewrites every URL in the file, and
  # pre-commit then fails the hook with "files were modified by this hook", on
  # every branch, for a diff no author wrote. A hook must never mutate the
  # lockfile.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix --exit-non-zero-on-fix
        require_serial: true
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        require_serial: true
        language: system
        types: [python]

      # Keep the venv current after branch switches / merges.
      - id: uv-sync
        name: uv sync
        entry: uv sync --locked --all-groups --all-extras
        pass_filenames: false
        language: system
        always_run: true
        stages: [post-checkout, post-merge]
