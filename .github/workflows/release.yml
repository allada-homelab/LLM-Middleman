name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  release:
    name: GitHub release from CHANGELOG
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches manifest.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/llm_middleman/manifest.json'))['version'])")
          if [ "${TAG#v}" != "$manifest" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $manifest"
            exit 1
          fi
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "${TAG#v}" "$RUNNER_TEMP/notes.md" <<'PY'
          import re, sys
          version, out = sys.argv[1:3]
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          start = next((i for i, l in enumerate(lines) if re.match(rf"## \[{re.escape(version)}\]", l)), None)
          if start is None:
              sys.exit(f"::error::CHANGELOG.md has no '## [{version}]' section")
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")), len(lines))
          body = "\n".join(lines[start + 1 : end]).strip()
          if not body:
              sys.exit(f"::error::CHANGELOG.md section [{version}] is empty")
          open(out, "w", encoding="utf-8").write(body + "\n")
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping creation."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
