name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so hassfest re-checks against HA's monthly releases without a push.
  schedule:
    - cron: '15 3 * * 1'

permissions: {}

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # HA publishes no release tags for this action (only a stale 1.0.0), so pin
      # master's SHA; it runs the untagged hassfest image, which still tracks HA.
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master
