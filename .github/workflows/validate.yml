name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so hassfest re-checks against HA's monthly releases without a push.
  schedule:
    - cron: '15 3 * * 1'

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # @master is HA's documented usage for hassfest; do not pin
      - uses: home-assistant/actions/hassfest@master
